# ============================================================
# ARIA — Docker Compose (branche `deploy` — Dokploy/Traefik)
# ============================================================
# ⚠️  Cette version est SPÉCIFIQUE à la branche `deploy` (déploiement
#     Dokploy perso sur le fork vgtray/Aria). NE JAMAIS la merger sur
#     `main` ni la pousser sur `zestones/Aria` — elle casserait le
#     `docker compose up` local de l'équipe (cf. revert PR #140).
#     Le compose de dev local vit sur `main`.
#
# Modèle réseau :
#   - Réseau interne `aria` : tous les services communiquent par hostname
#     (timescaledb, backend, ...). Rien n'est publié sur l'hôte (`expose`,
#     pas `ports`) → plus de conflit de port 5432 sur le serveur Dokploy.
#   - Seul le `frontend` rejoint `dokploy-network` (réseau Traefik partagé)
#     et est exposé en HTTPS. Le backend reste INTERNE : le frontend
#     proxifie `/api` → `backend:8000` (voir frontend/vite.config.ts).
#     → la base de données n'est jamais sur le réseau partagé.
#
# Déploiement Dokploy :
#   - Type "Docker Compose", branche `deploy`, fichier `docker-compose.yaml`.
#   - Variables d'env (onglet Environment) : voir .env.example.
#     FRONTEND_HOST doit valoir le domaine servi (def: aria.vgtray.fr,
#     qui doit aussi figurer dans `allowedHosts` de vite.config.ts).
# ============================================================

services:
  timescaledb:
    image: timescale/timescaledb:2.21.0-pg16
    container_name: aria-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Pas de `ports` : la DB reste interne au réseau `aria`.
    expose:
      - "5432"
    volumes:
      - aria_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [aria]

  migrate:
    image: postgres:16-alpine
    container_name: aria-migrate
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./backend/infrastructure/database/migrations:/migrations:ro
      - ./backend/infrastructure/database/seeds:/seeds:ro
    entrypoint: ["/bin/sh", "/migrations/apply.sh"]
    restart: "no"
    networks: [aria]

  # ── Simulators — one per monitored cell ───────────────────────────
  # Four containers share the same image but each runs a different
  # CELL_NAME + SIMULATOR_SCENARIO so live signal data flows on every
  # tile in the Control Room grid (not just the Bottle Filler).
  # The Bottle Labeler is intentionally excluded — it's the onboarding-
  # wizard target and stays signal-less until the operator uploads the
  # IOM PDF.

  simulator-filler:
    build:
      context: ./simulator
    container_name: aria-sim-filler
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SIMULATOR_MODE: ${SIMULATOR_MODE:-realtime}
      SIMULATOR_SCENARIO: bottle_filler
      SIMULATOR_TICK_INTERVAL_S: ${SIMULATOR_TICK_INTERVAL_S:-1.0}
      CELL_NAME: Bottle Filler
    restart: unless-stopped
    networks: [aria]

  simulator-source-pump:
    build:
      context: ./simulator
    container_name: aria-sim-source-pump
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SIMULATOR_MODE: ${SIMULATOR_MODE:-realtime}
      SIMULATOR_SCENARIO: source_pump
      SIMULATOR_TICK_INTERVAL_S: ${SIMULATOR_TICK_INTERVAL_S:-1.0}
      CELL_NAME: Source Pump
    restart: unless-stopped
    networks: [aria]

  simulator-uv:
    build:
      context: ./simulator
    container_name: aria-sim-uv
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SIMULATOR_MODE: ${SIMULATOR_MODE:-realtime}
      SIMULATOR_SCENARIO: uv_sterilizer
      SIMULATOR_TICK_INTERVAL_S: ${SIMULATOR_TICK_INTERVAL_S:-1.0}
      CELL_NAME: UV Sterilizer
    restart: unless-stopped
    networks: [aria]

  simulator-capper:
    build:
      context: ./simulator
    container_name: aria-sim-capper
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SIMULATOR_MODE: ${SIMULATOR_MODE:-realtime}
      SIMULATOR_SCENARIO: bottle_capper
      SIMULATOR_TICK_INTERVAL_S: ${SIMULATOR_TICK_INTERVAL_S:-1.0}
      CELL_NAME: Bottle Capper
    restart: unless-stopped
    networks: [aria]

  backend:
    build:
      context: ./backend
    container_name: aria-backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      MCP_API_KEY: ${MCP_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ARIA_MODEL: ${ARIA_MODEL:-sonnet}
      INVESTIGATOR_USE_MANAGED: ${INVESTIGATOR_USE_MANAGED:-false}
      ARIA_DEMO_ENABLED: ${ARIA_DEMO_ENABLED:-false}
      ARIA_MCP_PATH_SECRET: ${ARIA_MCP_PATH_SECRET}
      ARIA_MCP_PUBLIC_URL: ${ARIA_MCP_PUBLIC_URL:-}
      # ARIA_MCP_URL is intentionally omitted: the internal MCP client
      # derives it from ARIA_MCP_PATH_SECRET at startup. If the secret is
      # unset or is a placeholder the backend refuses to start with a clear
      # error message — set it with: openssl rand -hex 32
      # CORS : le frontend appelle le backend via le proxy Vite (même
      # origin que FRONTEND_HOST), donc on autorise ce seul domaine.
      CORS_ORIGINS: '["https://${FRONTEND_HOST:-aria.vgtray.fr}"]'
    # Interne uniquement : joignable par le frontend via hostname `backend`.
    expose:
      - "8000"
    # Prod : pas de --reload, pas de bind-mount (le code est dans l'image).
    # --proxy-headers : uvicorn est derrière le proxy Vite/Traefik.
    command:
      ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    restart: unless-stopped
    networks: [aria]
    # ── Backend public (OPTIONNEL — uniquement si INVESTIGATOR_USE_MANAGED=true)
    # Anthropic doit alors atteindre ARIA_MCP_PUBLIC_URL. Pour exposer le
    # backend, décommente ci-dessous, ajoute `dokploy-network` à `networks`
    # et set BACKEND_HOST + ARIA_MCP_PUBLIC_URL dans l'env Dokploy.
    # networks: [aria, dokploy-network]
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=dokploy-network"
    #   - "traefik.http.routers.aria-backend.rule=Host(`${BACKEND_HOST}`)"
    #   - "traefik.http.routers.aria-backend.entrypoints=websecure"
    #   - "traefik.http.routers.aria-backend.tls=true"
    #   - "traefik.http.routers.aria-backend.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.aria-backend.loadbalancer.server.port=8000"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: aria-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:-}
    profiles:
      - tunnel
    depends_on:
      - backend
    networks: [aria]

  frontend:
    build:
      context: ./frontend
    container_name: aria-frontend
    depends_on:
      - backend
    environment:
      # Cible du proxy Vite `/api` (voir frontend/vite.config.ts).
      VITE_API_URL: http://backend:8000
    # Pas de `ports` : exposé via Traefik (dokploy-network), pas sur l'hôte.
    expose:
      - "5173"
    # Prod : pas de bind-mount ni `npm install` runtime (fait au build).
    # Le CMD de l'image (`vite --host 0.0.0.0 --port 5173`) prend le relais.
    restart: unless-stopped
    networks: [aria, dokploy-network]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.aria-front.rule=Host(`${FRONTEND_HOST:-aria.vgtray.fr}`)"
      - "traefik.http.routers.aria-front.entrypoints=websecure"
      - "traefik.http.routers.aria-front.tls=true"
      - "traefik.http.routers.aria-front.tls.certresolver=letsencrypt"
      - "traefik.http.services.aria-front.loadbalancer.server.port=5173"

volumes:
  aria_pgdata:

networks:
  aria:
    driver: bridge
  dokploy-network:
    external: true
